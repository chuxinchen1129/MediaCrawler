<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不愿意尝试的原因TOP3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 720pt;
            height: 405pt;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            overflow: hidden;
        }

        .header {
            background: #277884;
            height: 60pt;
            display: flex;
            align-items: center;
            padding-left: 40pt;
        }

        .header h1 {
            font-size: 28pt;
            font-weight: bold;
            color: white;
        }

        .content {
            display: flex;
            padding: 25pt 40pt 35pt 40pt;
        }

        .left-column {
            flex: 1;
            padding-right: 20pt;
        }

        .right-column {
            flex: 1;
            padding-left: 20pt;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chart-placeholder {
            width: 100%;
            height: 220pt;
            background: #F4F6F6;
            border: 2pt dashed #FE4447;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8pt;
        }

        .chart-placeholder p {
            color: #FE4447;
            font-size: 13pt;
        }

        .barrier-item {
            margin-bottom: 10pt;
            padding: 8pt 10pt;
            background: #FFF5F5;
            border-left: 4pt solid #FE4447;
            border-radius: 4pt;
        }

        .barrier-rank {
            font-size: 12pt;
            font-weight: bold;
            color: #FE4447;
            margin-bottom: 4pt;
        }

        .barrier-text {
            font-size: 12pt;
            color: #2C2C2C;
            line-height: 1.3;
        }

        .recommendation {
            background: #5EA8A7;
            color: white;
            padding: 10pt;
            border-radius: 6pt;
            margin-top: 8pt;
        }

        .recommendation-title {
            font-size: 13pt;
            font-weight: bold;
            margin-bottom: 4pt;
        }

        .recommendation-text {
            font-size: 11pt;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>不愿意尝试的原因TOP3</h1>
    </div>
    <div class="content">
        <div class="left-column">
            <div class="chart-placeholder">
                <p>[横向条形图：不愿意尝试的原因]</p>
            </div>
        </div>
        <div class="right-column">
            <div class="barrier-item">
                <p class="barrier-rank">NO.1 口感不好 - 48.3%</p>
                <p class="barrier-text">产品体验不佳是最大障碍，消费者期望与实际存在差距</p>
            </div>
            <div class="barrier-item">
                <p class="barrier-rank">NO.2 失望体验 - 32.3%</p>
                <p class="barrier-text">首次尝试不满意导致复购意愿低，口碑传播负面影响</p>
            </div>
            <div class="barrier-item">
                <p class="barrier-rank">NO.3 价格/性价比 - 10.5%</p>
                <p class="barrier-text">价格偏高，性价比不如传统啤酒或饮料</p>
            </div>
            <div class="recommendation">
                <p class="recommendation-title">改进建议</p>
                <p class="recommendation-text">优先提升产品口感，降低首次体验门槛，通过试饮活动建立信任</p>
            </div>
        </div>
    </div>
</body>
</html>
