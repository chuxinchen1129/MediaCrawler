<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关键洞察与建议</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 720pt;
            height: 405pt;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            overflow: hidden;
        }

        .header {
            background: #277884;
            height: 60pt;
            display: flex;
            align-items: center;
            padding-left: 40pt;
        }

        .header h1 {
            font-size: 28pt;
            font-weight: bold;
            color: white;
        }

        .content {
            padding: 25pt 40pt 45pt 40pt;
        }

        .insights-section {
            margin-bottom: 10pt;
        }

        .section-title {
            font-size: 14pt;
            font-weight: bold;
            color: #FE4447;
            margin-bottom: 7pt;
        }

        .insight-item {
            margin-bottom: 5pt;
        }

        .insight-item-inner {
            padding: 5pt 10pt;
            border-left: 4pt solid #FE4447;
            border-radius: 4pt;
            font-size: 10pt;
            color: #2C2C2C;
        }

        .recommendations-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8pt;
        }

        .recommendation-card {
            background: #F4F6F6;
            padding: 8pt;
            border-radius: 6pt;
            border-top: 3pt solid #5EA8A7;
        }

        .rec-number {
            font-size: 9pt;
            font-weight: bold;
            color: #5EA8A7;
            margin-bottom: 2pt;
        }

        .rec-title {
            font-size: 11pt;
            font-weight: bold;
            color: #277884;
            margin-bottom: 4pt;
        }

        .rec-text {
            font-size: 9pt;
            color: #2C2C2C;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>关键洞察与建议</h1>
    </div>
    <div class="content">
        <div class="insights-section">
            <h2 class="section-title">关键洞察</h2>
            <div class="insight-item">
                <div class="insight-item-inner">
                    <p>口感是决定消费者是否尝试和复购的核心因素，占比近50%</p>
                </div>
            </div>
            <div class="insight-item">
                <div class="insight-item-inner">
                    <p>社交场景（聚会、开车）是最高频的使用场景，实用性突出</p>
                </div>
            </div>
            <div class="insight-item">
                <div class="insight-item-inner">
                    <p>78.6%的消费者持开放态度，市场基础良好但产品体验待提升</p>
                </div>
            </div>
        </div>

        <div class="recommendations-section">
            <div class="recommendation-card">
                <p class="rec-number">建议 01</p>
                <h3 class="rec-title">产品优化</h3>
                <p class="rec-text">优先解决口感问题，通过技术革新接近传统啤酒口感，降低尝试门槛</p>
            </div>

            <div class="recommendation-card">
                <p class="rec-number">建议 02</p>
                <h3 class="rec-title">场景营销</h3>
                <p class="rec-text">重点推广聚会、开车、健身三大场景，强化"不扫兴+0负担"卖点</p>
            </div>

            <div class="recommendation-card">
                <p class="rec-number">建议 03</p>
                <h3 class="rec-title">体验营销</h3>
                <p class="rec-text">通过试饮活动降低首次体验成本，收集真实反馈快速迭代产品</p>
            </div>

            <div class="recommendation-card">
                <p class="rec-number">建议 04</p>
                <h3 class="rec-title">精准触达</h3>
                <p class="rec-text">针对社交型、实用型、健康型用户制定差异化沟通策略</p>
            </div>
        </div>
    </div>
</body>
</html>
